name: Release DSH Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - name: Upload installer for release
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dsh-plugin-desktop/dist/*.exe
          retention-days: 1
      - name: Upload portable for release
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dsh-plugin-desktop/dist/*.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-assets
      - name: Download Windows portable
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: ./release-assets
      - name: List files
        run: ls -la ./release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: DSH Desktop ${{ github.ref_name || format('v0.1.{0}', github.run_number) }}
          body: |
            # DSH Desktop — 基于 wxj-1019/deepseek-harness 构建

            原生桌面端的 DeepSeek Harness，内嵌自定义 fork（含全部插件和 UI 定制）。

            ## 安装

            | 文件 | 说明 |
            |---|---|
            | `.exe` | Windows NSIS 安装程序，双击安装 |
            | `.zip` | Windows 免安装版，解压即用 |

            ## 特性

            - 原生桌面窗口（Electron），系统托盘集成
            - 自动启动和管理本地 dsh 服务
            - 内嵌 wxj-1019 fork（含自定义上传按钮、vision 修复、aqua 玻璃等）
            - 支持插件市场、终端集成、桌面通知
            - 纯本地运行，隐私优先
          draft: false
          prerelease: false
          files: |
            ./release-assets/*
