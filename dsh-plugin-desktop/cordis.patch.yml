# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: community-market
      name: dsh-community-market
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# Fork-only plugins the official web-app composition cannot reference: they
# exist only in this product (carried through .upstream-publish), so the
# desktop patch layer declares them on top of the official bundle.
- insert:
    - id: mcp-servers
      name: '@deepseek-ai/dsh-mcp-servers'
    - id: llm-vision-route
      name: '@deepseek-ai/dsh-llm-vision-route'
    - id: ui-aqua
      name: '@deepseek-ai/dsh-client-ui-aqua'
    - id: ui-desktop-notify
      name: '@deepseek-ai/dsh-client-ui-desktop-notify'
    - id: ui-settings-dev-checks
      name: '@deepseek-ai/dsh-client-ui-settings-dev-checks'
    - id: ui-settings-mcp
      name: '@deepseek-ai/dsh-client-ui-settings-mcp'
    - id: ui-settings-vision-model
      name: '@deepseek-ai/dsh-client-ui-settings-vision-model'

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: []
